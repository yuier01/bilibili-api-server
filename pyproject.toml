[project]
name = "bilibili-api-server-dev"
version = "0.1.0"
description = "Minimal Bilibili video-info HTTP service built on bilibili-api"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "bilibili-api-python==17.4.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

# 用本地 SDK 源码，保证行为和 bilibili-api/ 下的代码一致
[tool.uv.sources]
bilibili-api-python = { path = "../../bilibili-api", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
