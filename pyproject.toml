[project]
name = "bilibili-api-server-dev"
version = "0.1.0"
description = "Minimal Bilibili video-info HTTP service built on bilibili-api"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "bilibili-api-python==17.4.1",
]

[project.scripts]
# uv run bilibili-api-server --port 8000
bilibili-api-server = "app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

# 让 uv 把本项目也装进 venv（否则 [project.scripts] 不会生成命令）
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# 默认从 PyPI 装 17.4.1：服务器上只 clone 本仓库即可，不依赖旁边有没有 SDK 源码。
# 如果本地想用 bilibili-api/ 的源码（改 SDK 时调试用），不要改这里，改成：
#   uv pip install -e ../../bilibili-api
# 注意下一次 `uv sync` 会把它换回锁文件里的版本。
#
# [tool.uv.sources]
# bilibili-api-python = { path = "../../bilibili-api", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
